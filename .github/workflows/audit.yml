name: Dependency audit

# Vulnerabilidade nova aparece sem ninguém mexer no código: além de push e PR,
# roda toda semana contra os pins atuais.
on:
  push:
    branches:
      - main
      - master
    paths:
      - requirements*.txt
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - requirements*.txt
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Audit runtime dependencies
        # Resolve requirements.txt num ambiente isolado, incluindo as
        # transitivas, e falha em qualquer vulnerabilidade conhecida.
        run: pip-audit -r requirements.txt --strict --desc
