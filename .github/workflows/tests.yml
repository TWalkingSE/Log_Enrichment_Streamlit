name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy auth_password.py api_client.py validators.py helpers/large_data.py helpers/persistence.py export_ioc.py

      - name: Run test suite
        run: pytest tests -v --tb=short -m "not slow" --cov=data_processing --cov=auth_password --cov-report=term-missing --cov-fail-under=0

      # Carga sobre um DataFrame de 202k linhas: pega regressoes de
      # complexidade (O(n^2), copias do frame inteiro, exports sem teto) que
      # fixtures de poucas linhas nao revelam.
      - name: Load test (dataset de tamanho real)
        run: pytest tests/test_load.py -v --tb=short -m slow
