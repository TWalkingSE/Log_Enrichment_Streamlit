name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.11"
          - "3.12"
        include:
          # A ferramenta roda em Windows: `os.replace` sobre arquivo aberto,
          # codificação padrão cp1252 e bloqueio de arquivo só aparecem lá.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        # Lista de arquivos em pyproject.toml ([tool.mypy].files).
        run: mypy

      - name: Run test suite
        # Escopo e piso de cobertura em pyproject.toml ([tool.coverage]): o
        # projeto inteiro, e o job falha abaixo de `fail_under`.
        run: pytest tests -v --tb=short -m "not slow" --cov --cov-report=term-missing

      # Carga sobre um DataFrame de 202k linhas: pega regressoes de
      # complexidade (O(n^2), copias do frame inteiro, exports sem teto) que
      # fixtures de poucas linhas nao revelam.
      - name: Load test (dataset de tamanho real)
        # Uma vez por versão do Python, no Linux: o custo é de memória/tempo,
        # não de plataforma.
        if: runner.os == 'Linux'
        run: pytest tests/test_load.py -v --tb=short -m slow
