[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    ".git",
    "output",
    "logs",
    ".reversa",
    "_reversa_sdd",
    ".agents",
]

[tool.ruff.lint]
# Pragmatic baseline for legacy Streamlit codebase; tighten over time.
ignore = [
    "E402",   # module import not at top of file
    "F401",   # unused imports (common with conditional / re-exports)
    "F403",   # star imports (tests.common pattern)
    "F405",   # names from star imports
    "F541",   # f-string without placeholders
    "F841",   # unused local variable
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
files = ["auth_password.py", "api_client.py", "validators.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
