[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    ".git",
    "output",
    "logs",
    ".reversa",
    "_reversa_sdd",
    ".agents",
]

[tool.ruff.lint]
# Pragmatic baseline for legacy Streamlit codebase; tighten over time.
# F841 (variável local sem uso) reativado: foi assim que se achou um parâmetro
# de configuração lido e ignorado (`rotation_interval_minutes`).
ignore = [
    "E402",   # module import not at top of file
    "F403",   # star imports (tests.common pattern)
    "F405",   # names from star imports
    "F541",   # f-string without placeholders
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
# Lista única: o CI chama `mypy` sem argumentos e usa esta.
files = [
    "auth_password.py",
    "api_client.py",
    "validators.py",
    "enrich_service.py",
    "export_ioc.py",
    "helpers/atomic_io.py",
    "helpers/large_data.py",
    "helpers/persistence.py",
    "helpers/retention.py",
    "helpers/runtime_flags.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
    "slow: teste de carga sobre dataset de tamanho real (pytest -m 'not slow' para pular)",
]

[tool.coverage.run]
# Mede o projeto inteiro (antes: só data_processing e auth_password).
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
# Piso real: abaixo dele o CI falha. Suba quando a cobertura subir; não
# desça para acomodar código novo sem teste.
fail_under = 65
skip_empty = true
