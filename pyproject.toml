[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    ".git",
    "output",
    "logs",
    ".reversa",
    "_reversa_sdd",
    ".agents",
]

[tool.ruff.lint]
# Pragmatic baseline for legacy Streamlit codebase; tighten over time.
# F401 re-enabled for core modules; monólitos legados usam per-file-ignores.
ignore = [
    "E402",   # module import not at top of file
    "F403",   # star imports (tests.common pattern)
    "F405",   # names from star imports
    "F541",   # f-string without placeholders
    "F841",   # unused local variable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
files = ["auth_password.py", "api_client.py", "validators.py", "enrich_service.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
    "slow: teste de carga sobre dataset de tamanho real (pytest -m 'not slow' para pular)",
]
